
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #101c3b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            margin: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px gray;
        }

        .logo {
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: #00c8e8;
            border: 2px solid #00c8e8;
            padding: 8px;
            border-radius: 5px;
        }

        .logo h3 {
            font-size: 18px;
        }

        .a ul {
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
        }

        .a ul li {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .a ul li i {
            color: white;
            font-size: 13px;
        }

        .a ul li a {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .a ul li:first-child {
            background-color: #1676e8;
            padding: 8px 12px;
            border-radius: 20px;
        }

        .button {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .login {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 8px 15px;
            border-radius: 20px;
        }

        .start {
            background-color: #00c8e8;
            color: black;
            border: none;
            padding: 9px 15px;
            border-radius: 20px;
        }

    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <i class="fa fa-code"></i>
            <h3> Techrel</h3>
        </div>

        <div class="a">
            <ul>

                <li>
                    <i class="fa fa-home"></i>
                    <a href="">Home</a>
                </li>

                <li>
                    <i class="fa fa-users"></i>
                    <a href="">About</a>
                </li>

                <li>
                    <i class="fa fa-database"></i>
                    <a href="">Services</a>
                    <i class="fa fa-angle-down"></i>
                </li>

                <li>
                    <i class="fa fa-graduation-cap"></i>
                    <a href="">Courses</a>
                </li>

                <li>
                    <i class="fa fa-briefcase"></i>
                    <a href="">Projects</a>
                </li>

                <li>
                    <i class="fa fa-envelope"></i>
                    <a href="">Contact</a>
                </li>

            </ul>
        </div>

        <div class="button">
            <button class="login">
                <i class="fa fa-user"></i> Login
            </button>

            <button class="start">
                Get Started <i class="fa fa-arrow-right"></i>
            </button>
        </div>

    </nav>

</body>
</html>
